[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudex"
dynamic = ["version"]
description = "Codex agents for Claude Code, with a local session dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{name = "Daniel Asher"}]
keywords = ["claude-code", "codex", "mcp", "agents", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "starlette>=1.0,<2", "uvicorn>=0.30,<1", "websockets>=15,<17", "httpx>=0.28,<1",
  "pillow>=10,<14", "pypdfium2>=4.30,<6", "markdown-it-py>=4,<5", "psutil>=6,<8", "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "playwright>=1.50,<2"]

[project.urls]
Homepage = "https://github.com/danielasher115/claudex"
Issues = "https://github.com/danielasher115/claudex/issues"
Documentation = "https://github.com/danielasher115/claudex/tree/main/docs"

[project.scripts]
claudex = "codex_sessions.__main__:main"
codex-sessions = "codex_sessions.__main__:main"
codex-session = "codex_sessions.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "codex_sessions.__version__"}

[tool.setuptools.packages.find]
include = ["codex_sessions*"]

[tool.setuptools.package-data]
codex_sessions = ["static/*", "static/assets/*", "skills/codex-agents/SKILL.md", "completions/*.bash", "systemd/*.socket", "systemd/*.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
